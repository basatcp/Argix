            "@type": "ProfessionalService",
            "name": "Corelayer",
            "url": "https://www.example.com/",
            "provider": { "@id": "https://www.example.com/#organization" },
            "areaServed": "Worldwide",
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Software and cybersecurity services",
              "itemListElement": [
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom Software Development" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Web Application Development" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Solutions" } },

                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Penetration Testing" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "GRC & Compliance" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "SOC Monitoring" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "vCISO" } }
              ]
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How much does a project cost?",
                "acceptedAnswer": { "@type": "Answer", "text": "Pricing depends on scope. Start with a consultation and discovery phase, then provide either a fixed-scope estimate or an ongoing monthly engagement." }
              },
              {
                "@type": "Question",
                "name": "Can you secure software built by another team?",
                "acceptedAnswer": { "@type": "Answer", "text": "Yes. Existing systems can be assessed, tested and prioritized for remediation." }
              },
              {
                "@type": "Question",
                "name": "Can you make us SOC 2 or ISO 27001 certified?",
                "acceptedAnswer": { "@type": "Answer", "text": "No consultancy issues certification. The team can prepare the company, close gaps and support evidence collection for the independent auditor or certification body." }
              },
              {
                "@type": "Question",
                "name": "What happens after launch?",
                "acceptedAnswer": { "@type": "Answer", "text": "Clients can run the system themselves or retain ongoing support, monitoring and security services." }
              },
              {
                "@type": "Question",
                "name": "Do you provide development and cybersecurity together?",
                "acceptedAnswer": { "@type": "Answer", "text": "Yes. Software engineering, cloud, testing and security can be delivered as one integrated engagement." }
              }
            ]
          }
        ]
      }
